  <style>
    body {

      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    .glass-panel {

      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);

    }

    .hud-btn {
      display: inline-flex;
      align-items: center;

    .hud-btn:hover {

    .primary-download-btn {

</head>
<body>

  <!-- 3D Application Script -->
  <script>
    let scene, camera, renderer, controls;
    let paperMesh, ambientParticles;
    let isAutoRotating = true;
    let targetCameraPos = { x: 0, y: 0, z: 5.2 };
    let targetLookAt = { x: 0, y: 0, z: 0 };
    let frontTex, backTex;

    // 1. Generate Ultra High-Definition (4K Retina) 2D Canvas Texture of Eliot Hantute's CV
    function createCVTexture() {
      const canvas = document.createElement('canvas');
      // 4K physical canvas (4096 x 5792) for pin-sharp vector typography
      canvas.width = 4096;
      canvas.height = 5792; // A4 Ratio (1:1.414)
      const ctx = canvas.getContext('2d');

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      // 2x coordinate scaling so all positions map with native subpixel retina fidelity
      ctx.scale(2, 2);

      // Background Crisp White Fine-Art Paper
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 2048, 2896);

      // 1. TOP DARK HEADER BANNER
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 0, 2048, 480);

      // Name
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 86px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('Eliot Hantute', 100, 150);

      // Separator & Subtitle
      ctx.fillStyle = '#71717a';
      ctx.font = '500 50px "Inter", sans-serif';
      ctx.fillText('/', 740, 142);

      ctx.fillStyle = '#ffffff';
      ctx.font = '800 38px "Plus Jakarta Sans", sans-serif';
      ctx.fillText('Développeur Front-End', 790, 125);

      ctx.fillStyle = '#a1a1aa';
      ctx.font = '700 24px "JetBrains Mono", monospace';
      ctx.fillText('CREATIVE DEVELOPER', 790, 165);

      // Divider line in header
      ctx.strokeStyle = '#27272a';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(100, 210);
      ctx.lineTo(1948, 210);
      ctx.stroke();

      // Pitch paragraph in header
      const bio = "Développeur front-end, musicien et cuistot pro, j'applique la même exigence au code qu'à une partition ou une recette : sens du rythme, dosage des composants et exécution millimétrée. Spécialisé en React, TypeScript et Three.js, je conçois des interfaces modulaires et des expériences immersives où fluidité visuelle et rigueur technique ne font qu'un.";
      wrapText(ctx, bio, 100, 260, 1848, 26, 42, '#d4d4d8');

      // 2. MAIN DOCUMENT: 2 COLUMNS
      const leftColX = 100;
      const leftColW = 540;
      const rightColX = 720;

      // Vertical Divider
      ctx.strokeStyle = '#e4e4e7';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(670, 540);
      ctx.lineTo(670, 2760);
      ctx.stroke();

      // --- LEFT COLUMN ---
      let leftY = 560;

      // Section CONTACT
      ctx.fillStyle = '#09090b';
      ctx.font = '800 28px "JetBrains Mono", monospace';
      ctx.fillText('CONTACT', leftColX, leftY);
      leftY += 12;
      ctx.strokeStyle = '#09090b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(leftColX, leftY);
      ctx.lineTo(leftColX + leftColW - 60, leftY);
      ctx.stroke();

      leftY += 48;
      ctx.font = '500 26px "Inter", sans-serif';
      ctx.fillStyle = '#3f3f46';
      ctx.fillText('Paris, France', leftColX, leftY); leftY += 44;
      ctx.fillText('+33 7 75 03 68 75', leftColX, leftY); leftY += 44;
      ctx.font = '700 26px "Inter", sans-serif';
      ctx.fillStyle = '#09090b';
      ctx.fillText('eliot.hantute@gmail.com', leftColX, leftY); leftY += 44;
      ctx.fillText('eliotlab.fr', leftColX, leftY); leftY += 44;
      ctx.fillText('github.com/eliothantute', leftColX, leftY);

      // Section FORMATION
      leftY += 90;
      ctx.fillStyle = '#09090b';
      ctx.font = '800 28px "JetBrains Mono", monospace';
      ctx.fillText('FORMATION', leftColX, leftY);
      leftY += 12;
      ctx.strokeStyle = '#09090b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(leftColX, leftY);
      ctx.lineTo(leftColX + leftColW - 60, leftY);
      ctx.stroke();

      leftY += 45;
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillStyle = '#71717a';
      ctx.fillText('En cours', leftColX, leftY);
      leftY += 32;
      ctx.font = '800 28px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#09090b';
      ctx.fillText('Product Designer', leftColX, leftY);
      leftY += 30;
      ctx.font = '600 22px "Inter", sans-serif';
      ctx.fillStyle = '#3f3f46';
      ctx.fillText('RNCP Niv. 6 — Bac +3/4', leftColX, leftY);
      leftY += 28;
      ctx.font = '500 20px "Inter", sans-serif';
      ctx.fillStyle = '#71717a';
      ctx.fillText('OpenClassrooms', leftColX, leftY);

      leftY += 50;
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillStyle = '#71717a';
      ctx.fillText('2025', leftColX, leftY);
      leftY += 32;
      ctx.font = '800 28px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#09090b';
      ctx.fillText('BUT Info-Communication', leftColX, leftY);
      leftY += 30;
      ctx.font = '600 22px "Inter", sans-serif';
      ctx.fillStyle = '#3f3f46';
      ctx.fillText('Stratégie Digitale', leftColX, leftY);
      leftY += 28;
      ctx.font = '500 20px "Inter", sans-serif';
      ctx.fillStyle = '#71717a';
      ctx.fillText('IUT Haguenau / Univ. Strasbourg', leftColX, leftY);

      leftY += 50;
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillStyle = '#71717a';
      ctx.fillText('2015', leftColX, leftY);
      leftY += 32;
      ctx.font = '800 28px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#09090b';
      ctx.fillText('Bac STD2A', leftColX, leftY);
      leftY += 30;
      ctx.font = '600 22px "Inter", sans-serif';
      ctx.fillStyle = '#3f3f46';
      ctx.fillText('Design & Arts Appliqués', leftColX, leftY);
      leftY += 28;
      ctx.font = '500 20px "Inter", sans-serif';
      ctx.fillStyle = '#71717a';
      ctx.fillText('Paris 6e', leftColX, leftY);

      // Section LANGUES
      leftY += 90;
      ctx.fillStyle = '#09090b';
      ctx.font = '800 28px "JetBrains Mono", monospace';
      ctx.fillText('LANGUES', leftColX, leftY);
      leftY += 12;
      ctx.strokeStyle = '#09090b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(leftColX, leftY);
      ctx.lineTo(leftColX + leftColW - 60, leftY);
      ctx.stroke();

      const drawLanguage = (name, level, dots) => {
        leftY += 45;
        ctx.font = '800 26px "Inter", sans-serif';
        ctx.fillStyle = '#09090b';
        ctx.fillText(name, leftColX, leftY);
        ctx.font = '600 20px "JetBrains Mono", monospace';
        ctx.fillStyle = '#71717a';
        ctx.fillText(level, leftColX + leftColW - 140, leftY);
        leftY += 26;
        drawDots(ctx, leftColX, leftY, dots, 5);
      };

      drawLanguage('Français', 'Natif', 5);
      drawLanguage('Anglais', 'C1', 4);
      drawLanguage('Italien', 'A2', 2);

      // --- RIGHT COLUMN ---
      let rightY = 560;

      // Section EXPÉRIENCES PROFESSIONNELLES
      ctx.fillStyle = '#09090b';
      ctx.font = '800 28px "JetBrains Mono", monospace';
      ctx.fillText('EXPÉRIENCES PROFESSIONNELLES', rightColX, rightY);
      rightY += 12;
      ctx.strokeStyle = '#09090b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(rightColX, rightY);
      ctx.lineTo(1948, rightY);
      ctx.stroke();

      // Exp 1: Développeur Front-End
      rightY += 50;
      ctx.font = '800 32px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#09090b';
      ctx.fillText('Développeur', rightColX, rightY);
      rightY += 36;
      ctx.fillText('Front-End', rightColX, rightY);
      rightY += 32;
      ctx.font = '600 22px "Inter", sans-serif';
      ctx.fillStyle = '#52525b';
      ctx.fillText('Freelance', rightColX, rightY);
      rightY += 28;
      ctx.font = '700 22px "Inter", sans-serif';
      ctx.fillStyle = '#18181b';
      ctx.fillText('Eliot Lab', rightColX, rightY);
      rightY += 30;
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillStyle = '#71717a';
      ctx.fillText('2026 – Présent', rightColX, rightY);

      // Bullets for Exp 1
      const bullets1 = [
        "Atelier Berger — Globe 3D interactif (Three.js, React Globe GL), rendu WebGL 60 FPS stable.",
        "Hazi App — Plateforme IA agentique, LCP < 1.2s, Lighthouse 95+, micro-animations scroll.",
        "Les Humanités — Refonte media indépendant, SSG/ISR Next.js, référencement maximisé.",
        "Aum Paris — Showcase e-commerce luxe pixel-perfect, CLS: 0, 100% mobile-first.",
        "Nari OS — Environnement fenêtré interactif, gestion d'états avancée clavier/souris."
      ];

      let bulletY1 = 610;
      const bulletX = rightColX + 340;
      const bulletW = 1948 - bulletX;

      bullets1.forEach(b => {
        ctx.fillStyle = '#09090b';
        ctx.font = '800 24px "Inter", sans-serif';
        ctx.fillText('›', bulletX, bulletY1);
        bulletY1 = wrapText(ctx, b, bulletX + 26, bulletY1, bulletW - 30, 24, 38, '#27272a');
        bulletY1 += 14;
      });

      // Exp 2: Intégrateur Web
      rightY = Math.max(rightY + 40, bulletY1 + 30);

      ctx.font = '800 32px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = '#09090b';
      ctx.fillText('Intégrateur Web', rightColX, rightY);
      rightY += 32;
      ctx.font = '600 22px "Inter", sans-serif';
      ctx.fillStyle = '#52525b';
      ctx.fillText('Freelance', rightColX, rightY);
      rightY += 28;
      ctx.font = '700 22px "Inter", sans-serif';
      ctx.fillStyle = '#18181b';
      ctx.fillText('Missions indépendantes', rightColX, rightY);
      rightY += 30;
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillStyle = '#71717a';
      ctx.fillText('2025', rightColX, rightY);

      const bullets2 = [
        "Centre de Neuro-Pédagogie — Refonte HTML5/CSS/JS vanilla, audit perf & accessibilité.",
        "Le Comité du Souvenir Français — Intégration Figma → code, déploiement CI/CD."
      ];

      let bulletY2 = rightY - 80;
      bullets2.forEach(b => {
        ctx.fillStyle = '#09090b';
        ctx.font = '800 24px "Inter", sans-serif';
        ctx.fillText('›', bulletX, bulletY2);
        bulletY2 = wrapText(ctx, b, bulletX + 26, bulletY2, bulletW - 30, 24, 38, '#27272a');
        bulletY2 += 14;
      });

      rightY = Math.max(rightY + 30, bulletY2 + 40);

      // Section Divider before COMPÉTENCES
      ctx.strokeStyle = '#09090b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(rightColX, rightY);
      ctx.lineTo(1948, rightY);
      ctx.stroke();

      // Section COMPÉTENCES & EXPERTISE
      rightY += 50;
      ctx.fillStyle = '#09090b';
      ctx.font = '800 28px "JetBrains Mono", monospace';
      ctx.fillText('COMPÉTENCES & EXPERTISE', rightColX, rightY);
      rightY += 12;
      ctx.strokeStyle = '#09090b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(rightColX, rightY);
      ctx.lineTo(1948, rightY);
      ctx.stroke();

      const skillsLeft = [
        { name: 'TypeScript', dots: 5 },
        { name: 'Three.js / WebGL', dots: 4 },
        { name: 'Figma / Design', dots: 4 },
        { name: 'Git / CI/CD', dots: 4 },
        { name: 'HTML5 Sémantique', dots: 5 },
        { name: 'Framer Motion', dots: 4 },
        { name: 'Vercel / Deploy', dots: 4 },
        { name: 'GLSL Shaders', dots: 3 },
      ];

      const skillsRight = [
        { name: 'React / Next.js', dots: 5 },
        { name: 'CSS / Tailwind', dots: 5 },
        { name: 'GSAP / Animation', dots: 4 },
        { name: 'Performance Web', dots: 5 },
        { name: 'Vite / Webpack', dots: 4 },
        { name: 'A11y / WCAG', dots: 3 },
        { name: 'PWA', dots: 3 },
        { name: 'Atomic Design', dots: 4 },
      ];

      rightY += 45;
      const startSkillsY = rightY;
      const halfColW = (1948 - rightColX - 60) / 2;

      skillsLeft.forEach((s, i) => {
        const rowY = startSkillsY + i * 46;
        ctx.font = '700 24px "Inter", sans-serif';
        ctx.fillStyle = '#09090b';
        ctx.fillText(s.name, rightColX, rowY);
        drawDots(ctx, rightColX + halfColW - 130, rowY - 8, s.dots, 5);
      });

      skillsRight.forEach((s, i) => {
        const rowY = startSkillsY + i * 46;
        const col2X = rightColX + halfColW + 60;
        ctx.font = '700 24px "Inter", sans-serif';
        ctx.fillStyle = '#09090b';
        ctx.fillText(s.name, col2X, rowY);
        drawDots(ctx, col2X + halfColW - 130, rowY - 8, s.dots, 5);
      });

      // 3. BOTTOM DARK FOOTER
      ctx.fillStyle = '#09090b';
      ctx.fillRect(0, 2896 - 80, 2048, 80);

      ctx.fillStyle = '#a1a1aa';
      ctx.font = '700 20px "JetBrains Mono", monospace';
      ctx.fillText('ELIOT HANTUTE — CV 2026', 100, 2896 - 32);
      ctx.fillText('ELIOTLAB.FR', 1948 - ctx.measureText('ELIOTLAB.FR').width, 2896 - 32);

      const tex = new THREE.CanvasTexture(canvas);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    function drawDots(ctx, x, y, value, max) {
      for (let i = 0; i < max; i++) {
        ctx.beginPath();
        ctx.arc(x + i * 22, y, 7, 0, Math.PI * 2);
        if (i < value) {
          ctx.fillStyle = '#09090b';
          ctx.fill();
        } else {
          ctx.strokeStyle = '#a1a1aa';
          ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
  }

    // Helper: Round Rectangle on Canvas
    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
      if (fill) ctx.fill();
      if (stroke) ctx.stroke();
    }

    // Helper: Text Wrapping on Canvas
    function wrapText(ctx, text, x, y, maxWidth, fontSize, lineHeight, color) {
      ctx.fillStyle = color;
      ctx.font = `500 ${fontSize}px "Inter", sans-serif`;
      const words = text.split(' ');
      let line = '';
      let curY = y;

      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, curY);
          line = words[n] + ' ';
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, curY);
      return curY;
    }

    // 2. Generate Back Texture for 3D CV
    function createBackTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 2896;
      const ctx = canvas.getContext('2d');

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.scale(2, 2);

      // Gradient Dark Back
      const grad = ctx.createLinearGradient(0, 0, 1024, 1448);
      grad.addColorStop(0, '#111319');
      grad.addColorStop(1, '#08090d');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 1448);

      // Geometric Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 1024; x += 80) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1448);
        ctx.stroke();
      }
      for (let y = 0; y < 1448; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1024, y);
        ctx.stroke();
      }

      // Center Brand Badge
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 64px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ELIOT LAB', 512, 724 - 30);

      ctx.fillStyle = '#0066ff';
      ctx.font = '700 24px "JetBrains Mono", monospace';
      ctx.fillText('OFFICIAL 3D CURRICULUM VITAE', 512, 724 + 25);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.font = '500 20px "Inter", sans-serif';
      ctx.fillText('© 2026 Eliot Hantute • Paris, France', 512, 724 + 65);

      const tex = new THREE.CanvasTexture(canvas);
      tex.generateMipmaps = true;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      return tex;
    }

    // 3. Initialize Three.js Scene
    function init() {
      const container = document.getElementById('webgl-canvas');

      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(targetCameraPos.x, targetCameraPos.y, targetCameraPos.z);

      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 14;
      controls.minDistance = 2.5;

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 0.85);
      mainLight.position.set(5, 8, 7);
      mainLight.castShadow = true;
      mainLight.shadow.mapSize.width = 2048;
      mainLight.shadow.mapSize.height = 2048;
      scene.add(mainLight);

      const fillLight = new THREE.DirectionalLight(0x90c0ff, 0.4);
      fillLight.position.set(-6, -2, 4);
      scene.add(fillLight);

      const backLight = new THREE.DirectionalLight(0xffffff, 0.35);
      backLight.position.set(0, 4, -6);
      scene.add(backLight);

      // Create 3D Paper Document with Ultra-Sharp Matte Material
      frontTex = createCVTexture();
      frontTex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 16);
      backTex = createBackTexture();
      backTex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 16);

      const paperWidth = 4.2;
      const paperHeight = 5.94; // A4 Aspect Ratio
      const paperDepth = 0.03;

      const geometry = new THREE.BoxGeometry(paperWidth, paperHeight, paperDepth);
      const edgeMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });

      const materials = [
        edgeMaterial, // right
        edgeMaterial, // left
        edgeMaterial, // top
        edgeMaterial, // bottom
        new THREE.MeshStandardMaterial({
          map: frontTex,
          roughness: 0.95,
          metalness: 0.0,
        }), // front
        new THREE.MeshStandardMaterial({
          map: backTex,
          roughness: 0.6,
          metalness: 0.05,
        })  // back
      ];

      paperMesh = new THREE.Mesh(geometry, materials);
      paperMesh.castShadow = true;
      paperMesh.receiveShadow = true;
      scene.add(paperMesh);

      // Ambient Floor Shadow Plane
      const shadowPlaneGeo = new THREE.PlaneGeometry(12, 12);
      const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.35 });
      const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
      shadowPlane.position.y = -3.4;
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.receiveShadow = true;
      scene.add(shadowPlane);

      // Floating Dust Particles (Positioned strictly in background so they never intersect front text)
      const particleCount = 400;
      const particleGeo = new THREE.BufferGeometry();
      const pPositions = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        pPositions[i] = (Math.random() - 0.5) * 18;
        pPositions[i + 1] = (Math.random() - 0.5) * 18;
        pPositions[i + 2] = -1.5 - Math.random() * 10;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

      const particleMat = new THREE.PointsMaterial({
        size: 0.035,
        color: 0x0066ff,
        transparent: true,
        opacity: 0.35,
      });

      ambientParticles = new THREE.Points(particleGeo, particleMat);
      scene.add(ambientParticles);

      window.addEventListener('resize', onWindowResize);
      
      // Stop auto-rotation when user interacts manually
      controls.addEventListener('start', () => {
        isAutoRotating = false;
        updateHUDButtons();
      });

      // Reload texture once web fonts finish loading for perfect vector rendering
      if (document.fonts) {
        document.fonts.ready.then(() => {
          if (paperMesh && paperMesh.material && paperMesh.material[4]) {
            const updatedFrontTex = createCVTexture();
            updatedFrontTex.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 16);
            paperMesh.material[4].map = updatedFrontTex;
            paperMesh.material[4].needsUpdate = true;
          }
        });
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Set Predefined Camera Views
    function setView(view) {
      isAutoRotating = false;
      document.querySelectorAll('.hud-btn').forEach(btn => btn.classList.remove('active'));

      if (view === 'front') {
        document.getElementById('btn-front').classList.add('active');
        targetCameraPos = { x: 0, y: 0, z: 5.2 };
      } else if (view === 'iso') {
        document.getElementById('btn-iso').classList.add('active');
        targetCameraPos = { x: 4.8, y: 2.2, z: 6.2 };
      } else if (view === 'back') {
        document.getElementById('btn-back').classList.add('active');
        targetCameraPos = { x: 0, y: 0, z: -7.2 };
      }
    }

    function toggleAutoRotate() {
      isAutoRotating = !isAutoRotating;
      updateHUDButtons();
    }

    function updateHUDButtons() {
      const btn = document.getElementById('btn-autorotate');
      if (btn) {
        btn.textContent = `Auto-Rotation: ${isAutoRotating ? 'ON' : 'OFF'}`;
        if (isAutoRotating) btn.classList.add('active');
        else btn.classList.remove('active');
      }
    }

    function resetCamera() {
      setView('front');
    }

    // Animation Loop
    function animate(time) {
      requestAnimationFrame(animate);

      // Smooth Camera LERP
      camera.position.x += (targetCameraPos.x - camera.position.x) * 0.06;
      camera.position.y += (targetCameraPos.y - camera.position.y) * 0.06;
      camera.position.z += (targetCameraPos.z - camera.position.z) * 0.06;

      if (paperMesh) {
        // Floating Sinusoidal Breathing
        paperMesh.position.y = Math.sin(time * 0.0015) * 0.08;

        if (isAutoRotating) {
          paperMesh.rotation.y = Math.sin(time * 0.0008) * 0.35;
          paperMesh.rotation.x = Math.cos(time * 0.001) * 0.04;
        }
      }

      if (ambientParticles) {
        ambientParticles.rotation.y += 0.0005;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Start
    init();
    animate(0);
  </script>
</body>
</html>
